name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  contract:
    name: Kiem tra hop dong proto
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Kiem tra proto
      - uses: bufbuild/buf-action@v1
        with:
          input: proto-contracts/src/main/proto
          lint: true
          breaking: false

  build:
    name: Build va test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify